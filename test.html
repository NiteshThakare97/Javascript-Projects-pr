    <!-- HTML -->
    <input id="celsius" type="number" placeholder="Celsius" oninput="convertC()">
    <input id="fahrenheit" type="number" placeholder="Fahrenheit" oninput="convertF()">
    <p id="demo"></p>

    <script>
        // JavaScript
        function convertC() {
            let c = document.getElementById("celsius").value;
            let f = (c * 9 / 5) + 32;
            // Use toFixed(2) to round to two decimal places
            document.getElementById("fahrenheit").value = parseFloat(f.toFixed(2));
        }

        function convertF() {
            let f = document.getElementById("fahrenheit").value;
            let c = (f - 32) * 5 / 9;
            document.getElementById("celsius").value = parseFloat(c.toFixed(2));
        }
    </script>

    <script>
        const fruits = ["Hanana", "Orange", "Mango", "Apple"];
        const tree = new Array("Banyan", "Peepal", "Tulsi");
        let sum = new Array(fruits + "," + tree);
        document.getElementById("demo").innerHTML = sum;
    </script>
