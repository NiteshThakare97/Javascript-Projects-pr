<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
</head>

<body style="text-align: center;">

    <style>
        #box {
            background-color: #2f2a2a;
            width: 80px;
            height: 80px;
            margin: auto auto 20px;
            h1 {
                color: #fff;
                padding: 27%;
            }
        }
        
        button {
            border: none;
            color: #fff;
            padding: 6px 10px;
        }
        
        #increase {
            background-color: green;
        }
        
        .bg-blue {
            background-color: blue;
        }
        
        #reduce {
            background-color: red;
        }
    </style>

    <!-- Main body starts  -->
    <h2>Counter App</h2>
    <div id="box">
        <h1 id="counter"></h1>
    </div>

    <div>
        <button id="increase" onclick="add()">Increase </button>
        <button class="bg-blue" id="reset" onclick="reset()">Reset</button>
        <button id="reduce" onclick="reduce()">Decrease</button>
    </div>

    <div>
        <p>Enter Value to increase or decrease the number by <input id="number" type="number" required></input>
        </p>
        <button class="bg-blue" onclick="sum()">Sum</button>
    </div>

    <script src="counter-app.js"></script>

</body>

</html>
