<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Simple Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-5">
    <div class="container">
        <h2 class="mb-4">Feedback Form</h2>
        <form id="feedbackForm">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" name="name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Mobile Number</label>
                <input type="tel" class="form-control" name="mobile" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" name="message" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
            <div id="responseMsg" class="mt-3 text-success"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById("feedbackForm");
        const responseMsg = document.getElementById("responseMsg");

        form.addEventListener("submit", function(e) {
            e.preventDefault();
            const formData = new FormData(form);

            fetch("https://script.google.com/macros/s/AKfycbzZKOM5858z8dWSZ24AQVcy1raVYi6FdV4mWKKz2kfyQdeOaO1TnmaoKJS3YFzL_iE_/exec", {
                    method: "POST",
                    body: formData
                })
                .then(() => {
                    responseMsg.textContent = "Form submitted successfully!";
                    form.reset();
                })
                .catch(() => {
                    responseMsg.textContent = "There was an error. Please try again.";
                });
        });
    </script>
</body>

</html>
