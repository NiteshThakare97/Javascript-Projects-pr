    <!-- Palindrome checker  -->
    <input type="text" placeholder="enter Palindrome" id="palindrome">
    <button onclick="check()">Check</button>

    <div>
        <h2 id="res"></h2>
    </div>

    <script>
        function check() {
            const text = document.getElementById("palindrome").value.toLowerCase().replace(/[^a-z0-9]/g, '');
            const newText = text.split('').reverse().join('');

            if (text === "") {
                return document.getElementById("res").innerHTML = "Please enter something!!"
            }

            let result;

            if (text === newText && text !== "") {
                result = "It is a Palindrome"
            } else {
                result = "Not a Palindrome"
            }

            document.getElementById("res").innerHTML = text + ':' + " " + result;
        }
    </script>
